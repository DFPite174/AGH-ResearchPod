[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agh-research-pod"
version = "0.1.0"
description = "AGH Research Pod: Academic + GitHub + HuggingFace Tri-Engine Autonomous Opportunity Discovery & Replication Pod for Quantitative Finance"
readme = "README.md"
authors = [
    { name = "Archimedes Quant Labs", email = "research@archimedes-quant.org" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
agh = "agh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
